name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pearl27/web lint
      - run: pnpm --filter @pearl27/web typecheck
      - run: pnpm --filter @pearl27/contracts test
      - run: pnpm --filter @pearl27/web test
      - run: pnpm --filter @pearl27/web build
